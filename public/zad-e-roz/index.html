<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAD-E-ROZ | Hakeem Zaki</title>
<meta name="description" content="Deen aur Tibb ki Mukhtasar Rozana Rehnumai">
<style>
:root{--green:#064f3b;--green2:#0b6b51;--ivory:#f7f3e9;--gold:#b17b22;--ink:#17211d;--line:#ded6c4}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1120px;margin:auto;padding:28px 18px 60px}.hero{background:var(--green);color:white;border-radius:28px;padding:34px 28px;margin-bottom:24px}
.hero h1{margin:0;font-size:clamp(36px,7vw,68px);letter-spacing:.02em}.hero p{margin:8px 0 0;opacity:.9;font-size:18px}
.meta{margin-top:18px;display:inline-block;background:#fff;color:var(--green);padding:9px 14px;border-radius:999px}
.tabs{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}.tabs button{border:1px solid var(--green);background:white;color:var(--green);padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer}
.tabs button.active{background:var(--green);color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:white;border:1px solid var(--line);border-radius:24px;overflow:hidden}
.card img{display:block;width:100%;height:auto}.card .cap{padding:14px 16px 18px}.card h2{font-size:20px;margin:0 0 6px}.tag{color:var(--gold);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.08em}
.archive{margin-top:34px}.archive h2{font-size:26px}.archive a{color:var(--green);font-weight:700}.note{margin-top:28px;padding:16px 18px;border-radius:16px;background:#eef5f2;color:#4c5d56}
@media(max-width:720px){.grid{grid-template-columns:1fr}.hero{border-radius:20px;padding:26px 20px}}
</style>
</head>
<body><main class="wrap">
<section class="hero"><h1>ZAD-E-ROZ</h1><p>Deen aur Tibb ki Mukhtasar Rozana Rehnumai</p><div class="meta" id="meta">Loading today's edition…</div></section>
<div class="tabs"><button data-lang="urdu">اردو</button><button class="active" data-lang="roman">Roman Urdu</button></div>
<section class="grid" id="cards"></section>
<section class="archive"><h2>Archive</h2><div id="archive"></div></section>
<p class="note">General education only; not a substitute for personal diagnosis or treatment.</p>
</main>
<script>
const FEED="./feed.json"; let feed,lang="roman";
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function render(){
 const p=feed.posts.find(x=>x.date===feed.latest)||feed.posts[0]; if(!p)return;
 document.getElementById("meta").textContent=p.date_display+"  |  "+p.hijri;
 const cards=p.cards.filter(c=>c.language===lang);
 document.getElementById("cards").innerHTML=cards.map(c=>`<article class="card"><a href="${esc(c.image_url)}" target="_blank" rel="noopener"><img src="${esc(c.image_url)}" alt="${esc(c.title)}"></a><div class="cap"><div class="tag">${esc(c.section)}</div><h2 dir="${lang==="urdu"?"rtl":"ltr"}">${esc(c.title)}</h2></div></article>`).join("");
 document.getElementById("archive").innerHTML=feed.posts.map(x=>`<p><strong>${esc(x.date_display)}</strong> — ${esc(x.hijri)}</p>`).join("");
}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.querySelectorAll("[data-lang]").forEach(x=>x.classList.toggle("active",x===b));render()});
fetch(FEED,{cache:"no-store"}).then(r=>r.json()).then(x=>{feed=x;render()}).catch(()=>document.getElementById("meta").textContent="Edition unavailable");
</script></body></html>
